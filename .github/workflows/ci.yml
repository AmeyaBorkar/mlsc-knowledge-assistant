name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        # Integration tests download a 130 MB model; they run in the job below, which
        # caches it. This job stays fast so lint/type feedback is not held up by a download.
        run: pytest -m "not integration" --cov=mlsc_assistant --cov-report=term-missing

  retrieval-gate:
    name: Retrieval quality gate
    runs-on: ubuntu-latest
    # No API key: indexing and every retrieval metric run offline by design (see docs/DECISIONS.md D4),
    # so retrieval quality can be gated on every push rather than checked by hand.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: data/cache
          key: fastembed-bge-small-${{ hashFiles('config.yaml') }}

      - name: Build index
        run: mlsc index

      - name: Integration tests against the real embedding model
        run: pytest -m integration

      # Phase 3 replaces this with the real gate:
      #   mlsc eval --metrics retrieval --fail-under recall_at_k=0.80
      # It needs the evaluation set, which does not exist yet.
