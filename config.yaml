# ---------------------------------------------------------------------------
# MLSC Knowledge Assistant — default configuration
#
# Every value here can be overridden by an environment variable using the
# MLSC_ prefix and __ as the nesting separator, e.g.
#     MLSC_RETRIEVAL__TOP_K=8
#     MLSC_LLM__PROVIDER=anthropic
# Secrets live in .env and never in this file.
# ---------------------------------------------------------------------------

knowledge_base:
  path: data/knowledge_base
  glob: "*.txt"

chunking:
  strategy: structural          # structural | fixed
  version: structural-v1        # recorded in the index manifest
  min_tokens: 40                # short paragraphs merge upward to this floor
  max_tokens: 320               # a chunk above this is split at sentence boundaries
  keep_lists_atomic: true       # never split a list block from its introducing sentence
  prepend_doc_title: true       # embed as "{doc_title} - {chunk}"; stored text stays clean

embedding:
  backend: fastembed            # fastembed | sbert
  model: BAAI/bge-small-en-v1.5
  dimension: 384
  batch_size: 32
  cache_dir: data/cache/embeddings
  models_dir: data/cache/models    # ONNX model cache, kept in-repo rather than system temp

store:
  backend: numpy                # numpy | chroma
  path: data/index

retrieval:
  strategy: hybrid              # hybrid | dense | lexical
  top_k: 6
  candidate_k: 15               # per-retriever depth before fusion
  rrf_k: 60                     # RRF constant; rank-based, so no score normalisation needed
  max_chunks_per_document: 3    # diversification — the multi-document lever
  bm25:
    k1: 1.5
    b: 0.75
    index_title: true      # measured: dropping it loses the domain-list chunk entirely
    max_document_frequency: 0.5   # drop query terms in >50% of chunks; they rank by noise
  rerank:
    enabled: false              # an 18-chunk corpus cannot justify the latency
    backend: llm

abstention:
  # Gate 1 — retrieval threshold. CALIBRATED, not hand-picked.
  #
  # `mlsc eval` sweeps this across the dev set and reports the abstention
  # precision/recall curve. The measured curve (hybrid, k=6, 40 questions):
  #
  #   thresh   abst.P  abst.R  halluc  over-refuse  near-miss R  off-domain R
  #   0.550     1.00    0.17    0.83      0.00          0.00         0.67
  #   0.650     0.60    0.25    0.75      0.07          0.00         1.00
  #   0.750     0.45    0.75    0.25      0.39          0.67         1.00
  #   0.800     0.38    1.00    0.00      0.71          1.00         1.00
  #
  # 0.55 is the highest threshold that refuses no answerable question at all. Above it,
  # over-refusal starts immediately and near-miss recall stays at zero until 0.75 — by
  # which point 39% of answerable questions are being refused. Catching near misses with
  # a threshold is therefore not merely suboptimal, it is impossible at any usable
  # operating point. That is gate 2's job, measured rather than argued.
  #
  # Rationale for the choice: gate 1 runs before the LLM and should cheaply remove
  # obvious noise without ever harming a real question, so zero over-refusal is the
  # binding constraint and F1 is not.
  min_dense_score: 0.55
  min_score_margin: 0.0         # gap between rank 1 and rank 2; 0 disables the check
  calibrated: true
  require_sufficient_context: true    # gate 2
  verify_faithfulness: false          # gate 3 — costs an extra call

llm:
  provider: gemini              # gemini | anthropic | openai | groq | ollama

  # `model` is intentionally left unset. Config sources deep-merge, so a pinned model
  # here would survive a provider override — `MLSC_LLM__PROVIDER=anthropic` would then
  # try to call Anthropic with a Gemini model name. Leaving it unset lets the per-provider
  # `models` map below resolve the default. Set it only to pin one specific model.
  # model: gemini-2.5-flash

  temperature: 0.0              # grounded extraction, not creative writing
  max_output_tokens: 800
  timeout_s: 30
  max_retries: 5                # transient 503s and 429s from Gemini are routine

  # Client-side pacing. Measured on the free tier: gemini-3.5-flash allows 5 requests per
  # minute AND only 20 per day, which makes a 40-question evaluation run impossible on it.
  # The lite model has a far larger allowance. Set to null on a paid tier.
  requests_per_minute: 15

  # Gemini reasoning tokens. 0 = off. Measured: identical abstention verdict with and
  # without thinking, 1.18s vs 39s. Set to null to restore the model's own default.
  thinking_budget: 0

  # Per-provider defaults used when the provider is selected without an explicit model.
  # Pinned versions, never the `-latest` aliases: an alias that silently changes model
  # would invalidate every recorded evaluation metric without any visible cause.
  #
  # gemini-3.1-flash-lite rather than a full flash model, chosen on measured constraints
  # rather than preference: gemini-3.5-flash allows only 20 free requests per DAY, so a
  # single evaluation run cannot complete on it, and gemini-3.7-flash took 55s for a
  # two-token reply. The lite model answers in ~2s and handled every hard abstention case
  # correctly, including the adversarial one where a nearby passage supplies a decoy number.
  models:
    gemini: gemini-3.1-flash-lite
    anthropic: claude-haiku-4-5-20251001
    openai: gpt-4.1-mini
    groq: llama-3.3-70b-versatile
    ollama: llama3.1:8b

generation:
  prompt_version: grounded-v1   # travels into every evaluation run
  max_context_chunks: 6
  include_doc_titles: true

evaluation:
  dataset_dir: evaluation/datasets
  runs_dir: evaluation/runs
  default_dataset: dev_set
  k_values: [3, 5, 6, 10]       # metrics reported at several k, never just one
  judge:
    provider: gemini            # switchable to a different provider to reduce self-preference bias
    model: gemini-2.5-flash
    temperature: 0.0
    cache: true                 # keyed by (question, answer, context, prompt_version)
  relevancy_questions: 3        # hypothetical questions generated per answer

api:
  host: 127.0.0.1
  port: 8000
  cors_origins: ["http://localhost:8000"]
  max_question_length: 1000
  serve_web_ui: true

log_level: INFO
